# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Reproduces the release shape gooci has always shipped (v0.0.7 was built with goreleaser's
# defaults, as this file was misspelled and never read): the default targets
# (linux/darwin/windows x 386/amd64/arm64, minus darwin/386), default tar.gz archives named
# gooci_<version>_<os>_<arch>.tar.gz holding the binary and README.md, and a checksums file.
# Don't override goos, the archive name or format, or files without deciding to change that.
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - binary: gooci
    env:
      - CGO_ENABLED=0

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# release-please creates the GitHub release; release-go-lib.yml then runs goreleaser to attach
# the archives. prerelease: auto keeps a vX.Y.Z-rcN tag a pre-release (the workflow refuses
# anything else); replace_existing_artifacts lets a re-run overwrite a partial upload.
release:
  prerelease: auto
  replace_existing_artifacts: true
