name: Build and Release Binaries

on:
  push:
    tags:
      - '*'

jobs:
  # test.yml is replaced by ci.yml (shared CI, which tests every push to main). This
  # workflow is removed when the shared release workflow lands.
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # 'latest', 'nightly', or a semver
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
