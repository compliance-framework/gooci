# Publishes a release (kind go-lib): goreleaser attaches the archives to the GitHub release
# release-please (or cut-prerelease) created, via the shared compliance-framework/workflows
# release-go-lib.yml.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-lib.yml@e85d35af2af2ddfcd4b92061d2063e665c1831f6 # v1.7.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
