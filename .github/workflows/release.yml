# Publishes a release (kind go-lib): goreleaser attaches the archives to the GitHub release
# release-please (or cut-prerelease) created, via the shared compliance-framework/workflows
# release-go-lib.yml.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-lib.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
