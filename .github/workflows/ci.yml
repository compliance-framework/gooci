# Shared go-lib CI from compliance-framework/workflows, pinned to a release commit that
# ccf-bump moves. The status check to require is `ci / required`.
name: ci

on:
  pull_request:
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-go-lib.yml@ca987fae431ad10a65315b87ae87a5a579f817a9 # v1.3.2
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  notify:
    needs: [ci]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@ca987fae431ad10a65315b87ae87a5a579f817a9 # v1.3.2
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
